# Подкачка в сжатой памяти (zram) для стека mytasks: llama.cpp, OCR квитанций и
# ночные задания переживают пики памяти без OOM. Размер — объём RAM (это предел
# несжатых данных, а не занятая память), сжатие zstd. Ставит check_mytasks.sh,
# только если своей настройки zram у дистрибутива нет. Откат — удалить файл.
[zram0]
zram-size = ram
compression-algorithm = zstd
