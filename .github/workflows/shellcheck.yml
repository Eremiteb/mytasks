name: Shell & Python checks

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**.sh"
      - "**.py"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "**.sh"
      - "**.py"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (error + style + all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        # shellcheck-py 0.11.0.1 (бинарник shellcheck 0.11.0) из PyPI — версия
        # зафиксирована. Прямая загрузка архива с GitHub убрана: контрольной
        # суммы релиза в репозитории нет, а непроверенный бинарник ставить нельзя.
        # (Пакет apt в Ubuntu noble — 0.9.0 — даёт ложные SC2317 на функциях,
        # вызываемых только через `trap`, исправлено в 0.11.0.)
        # pipx предустановлен на раннерах; pip --user на них упирается в PEP 668.
        run: |
          pipx install "shellcheck-py==0.11.0.1"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"
          shellcheck --version

      - name: ShellCheck error level
        run: shellcheck -S error ./*.sh llamactl/*.sh utility_bills/*.sh

      # Все дополнительные проверки (в том числе SC2312) — обязательное
      # требование к скриптам; локально shellcheck не запускается.
      - name: ShellCheck all optional checks
        run: shellcheck -o all ./*.sh llamactl/*.sh utility_bills/*.sh

      - name: ShellCheck style level
        run: shellcheck -S style ./*.sh llamactl/*.sh utility_bills/*.sh

      - name: Bash/sh syntax
        run: |
          for f in ./*.sh llamactl/*.sh utility_bills/*.sh; do
            if head -1 "$f" | grep -qi bash; then
              bash -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
            else
              sh -n "$f"   || { echo "SYNTAX FAIL: $f"; exit 1; }
            fi
          done

      - name: Unbraced variable scan
        run: |
          fail=0
          for f in ./*.sh llamactl/*.sh utility_bills/*.sh; do
            out=$(grep -nP '(?<!")\$(?!\{)[A-Za-z_][A-Za-z0-9_]*' "$f" \
              | grep -vP '^\d+:\s*#' \
              | grep -v "\\\\'" \
              | grep -v 'sh -lc\|bash -c\|PURGE_BINLOGS' \
              || true)
            if [ -n "$out" ]; then
              echo "=== $f ===" && echo "$out"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

  python-check:
    name: Python syntax + Ruff (llamactl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Python syntax check
        run: |
          for f in ./*.py llamactl/*.py; do
            python3 -m py_compile "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done

      # Трей и статус llamactl — Ruff с длиной строки 130 (у music_downloader
      # свой .ruff.toml и свой workflow). pipx есть в образе ubuntu-latest.
      - name: Ruff (llamactl)
        run: pipx run --spec "ruff==0.17.0" ruff check --line-length 130 llamactl/llamactl_tray.py llamactl/llamactl_status.py llamactl/llama_lang_router.py tests/test_llama_lang_router.py

      # Прокси llama_lang_router: только stdlib, тесты на unittest
      - name: Tests (llama_lang_router)
        run: python3 -m unittest tests/test_llama_lang_router.py -v
