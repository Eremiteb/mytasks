name: Shell & Python checks

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**.sh"
      - "**.py"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "**.sh"
      - "**.py"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    name: ShellCheck (error + style + all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        # Пакет apt в Ubuntu (0.9.0 в noble) даёт известные ложные SC2317 на
        # функциях, вызываемых только через `trap` (исправлено в 0.11.0), —
        # поэтому ставим текущий стабильный релиз напрямую.
        # Загрузка релиза с GitHub временами отвечает раннеру 504 (2026-11-08 —
        # три попытки подряд): повторы curl, а при неудаче — та же версия из
        # PyPI (shellcheck-py), у которого другой CDN.
        run: |
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o shellcheck.tar.xz \
              "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"; then
            tar -xJf shellcheck.tar.xz
            sudo install -m 755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          else
            echo "::warning::релиз shellcheck на GitHub недоступен — ставлю shellcheck-py из PyPI"
            # pipx предустановлен на раннерах; pip --user на них упирается в PEP 668
            pipx install "shellcheck-py==0.11.0.1"
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
          fi
          shellcheck --version

      - name: ShellCheck error level
        run: shellcheck -S error ./*.sh llamactl/*.sh

      # Все дополнительные проверки (в том числе SC2312) — обязательное
      # требование к скриптам; локально shellcheck не запускается.
      - name: ShellCheck all optional checks
        run: shellcheck -o all ./*.sh llamactl/*.sh

      - name: ShellCheck style level
        run: shellcheck -S style ./*.sh llamactl/*.sh

      - name: Bash/sh syntax
        run: |
          for f in ./*.sh llamactl/*.sh; do
            if head -1 "$f" | grep -qi bash; then
              bash -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
            else
              sh -n "$f"   || { echo "SYNTAX FAIL: $f"; exit 1; }
            fi
          done

      - name: Unbraced variable scan
        run: |
          fail=0
          for f in ./*.sh llamactl/*.sh; do
            out=$(grep -nP '(?<!")\$(?!\{)[A-Za-z_][A-Za-z0-9_]*' "$f" \
              | grep -vP '^\d+:\s*#' \
              | grep -v "\\\\'" \
              | grep -v 'sh -lc\|bash -c\|MARIADB_ROOT\|REDIS_WAIT\|PURGE_BINLOGS\|TRUNCATE\|in_progress' \
              || true)
            if [ -n "$out" ]; then
              echo "=== $f ===" && echo "$out"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

  python-check:
    name: Python syntax + Ruff (llamactl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Python syntax check
        run: |
          for f in ./*.py llamactl/*.py; do
            python3 -m py_compile "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done

      # Трей и статус llamactl — Ruff с длиной строки 130 (у music_downloader
      # свой .ruff.toml и свой workflow). pipx есть в образе ubuntu-latest.
      - name: Ruff (llamactl)
        run: pipx run --spec "ruff>=0.17.0" ruff check --line-length 130 llamactl/llamactl_tray.py llamactl/llamactl_status.py
