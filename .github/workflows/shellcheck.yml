name: ShellCheck

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.sh'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**.sh'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -S error ./*.sh