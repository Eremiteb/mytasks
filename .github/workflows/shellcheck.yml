name: Shell & Python checks

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**.sh"
      - "**.py"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "**.sh"
      - "**.py"

jobs:
  shellcheck:
    name: ShellCheck (error + style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        # Ubuntu's apt package (0.9.0 on noble) has known false positives for
        # SC2317 on functions only invoked via `trap` (fixed upstream by 0.11.0)
        # — install the current stable release directly instead.
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 755 shellcheck-stable/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck error level
        run: shellcheck -S error ./*.sh

      - name: ShellCheck style level
        run: shellcheck -S style ./*.sh

      - name: Bash/sh syntax
        run: |
          for f in ./*.sh; do
            if head -1 "$f" | grep -qi bash; then
              bash -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
            else
              sh -n "$f"   || { echo "SYNTAX FAIL: $f"; exit 1; }
            fi
          done

      - name: Unbraced variable scan
        run: |
          fail=0
          for f in ./*.sh; do
            out=$(grep -nP '(?<!")\$(?!\{)[A-Za-z_][A-Za-z0-9_]*' "$f" \
              | grep -v '^\s*#' \
              | grep -v "\\\\'" \
              | grep -v 'sh -lc\|bash -c\|MARIADB_ROOT\|REDIS_WAIT\|PURGE_BINLOGS\|TRUNCATE\|in_progress' \
              || true)
            if [ -n "$out" ]; then
              echo "=== $f ===" && echo "$out"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

  python-check:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          for f in ./*.py; do
            python3 -m py_compile "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done
